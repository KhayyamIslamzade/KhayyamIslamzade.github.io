  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('portfolio-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : prefersDark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = theme === 'dark' ? '#09090b' : '#f8fafc';
      } catch (_) {
      }
    })();
  </script>
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6fa;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .dark #app-splash {
      background: #0c0c10;
    }

    #app-splash.app-splash--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-splash__spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(17, 24, 39, 0.1);
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: splash-spin 0.7s linear infinite;
    }

    .dark .app-splash__spinner {
      border-color: rgba(248, 250, 252, 0.08);
      border-top-color: #5eead4;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
