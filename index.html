        document.documentElement.style.colorScheme = theme;
      } catch (_) {
      }

  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6fa;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .dark #app-splash {
      background: #0c0c10;
    }
    #app-splash.app-splash--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-splash__spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(17, 24, 39, 0.1);
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: splash-spin 0.7s linear infinite;
    }
    .dark .app-splash__spinner {
      border-color: rgba(248, 250, 252, 0.08);
      border-top-color: #5eead4;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

<script id="ng-state" type="application/json">{"9670bf41af5b625f2472bfc6129c042cfebed9cde0b7431ff9ad5e08240ee500":{"b":{"statusCode":200,"message":"GET Request completed successfully","isError":false,"error":null,"result":{"id":"d11bd880-6f1b-40f5-b1dc-95a928b26392","fullName":"Khayyam Islamzade","title":"Senior .NET Developer","headline":"Senior .NET Developer building scalable backend, frontend, cloud and AI-oriented portfolio products.","summary":"Senior .NET Developer with 8+ years of experience delivering scalable backend and frontend systems. Specialized in ASP.NET Core, Azure, Angular, React, cloud automation, clean architecture and delivery-focused engineering.","aboutMeText":"=== PROFESSIONAL PROFILE ===\n- Full Name: Khayyam Islamzade.\n- Location: Baku, Azerbaijan.\n- Role: Senior .NET Developer \u002F Software Engineer.\n- Experience: 8+ years delivering scalable backend, frontend, cloud, and AI-oriented software systems.\n- Core focus: ASP.NET Core, Azure, Angular, React, Clean Architecture, CQRS, Domain-Driven Design, cloud automation, DevOps, and AI\u002FLLM engineering.\n- Professional positioning: Practical senior engineer who cares about maintainability, clear ownership, reliable delivery, and business impact.\n\n=== EDUCATION & ENGINEERING FOUNDATIONS ===\n- B.S. in Computer Engineering from Sakarya University, 2014-2018.\n- Active member of Sakarya University Robotics Club (SauRo), working on Sumo robots, Line-Follower robots, and hardware components.\n- Graduation project: Autonomous RC Car using map-based route calculations and sensors to navigate to target coordinates.\n- Strong mathematical and analytical background, with an engineering style shaped by structured problem solving.\n\n=== PROFESSIONAL EXPERIENCE & IMPACT ===\n- Binoplus: Started as an intern and advanced to Software Engineer, building a strong foundation in the .NET ecosystem.\n- Azercosmos: Architected and launched a Geographic Information System (GIS) platform almost from scratch, with team growth around the product over time.\n- Azerbaijan Investment Holding (AIH): Worked as Lead Developer, initially as the sole engineer and later scaling the team. Built a sovereign financial platform for government entity balance sheets, cash flows, analytics, secure document repositories, and video-related workflows.\n- CHI Software: Developed enterprise insurance platforms using Java, React, .NET, Azure infrastructure, Terraform, Kubernetes-oriented delivery, and CI\u002FCD automation.\n\n=== PRODUCTS & PROJECT WORK ===\n- CurieSoft: Custom Enterprise Resource Planning (ERP) platform.\n- WebAptek: E-pharmacy and telemedicine platform built with the core team, including delivery integrations, online doctor appointments, digital prescriptions, and medication reminder notifications.\n- WebiDea: Gym CRM system with automated turnstile gate integration for hardware-level member access control.\n\n=== TECHNICAL STRENGTHS ===\n- Backend: ASP.NET Core, REST APIs, modular systems, Clean Architecture, CQRS, DDD, authentication\u002Fauthorization, integration-heavy systems.\n- Frontend: Angular, React, TypeScript, UI integration, data-driven application flows.\n- Cloud & DevOps: Azure, Docker, Terraform, Kubernetes-oriented infrastructure, CI\u002FCD pipelines, cloud automation.\n- Data: Relational databases, query design, reporting\u002Fanalytics workflows, document repositories, operational data modeling.\n- AI Engineering: Generative AI, autonomous\u002Fagentic workflows, Semantic Kernel, RAG applications, vector databases such as pgvector and Qdrant.\n\n=== ENGINEERING PHILOSOPHY ===\n- Prefer maintainable architecture, clear boundaries, testability, and pragmatic delivery over premature complexity.\n- Values constructive code reviews, collaborative problem solving, technical mentoring, and continuous improvement.\n- Calm and methodical during production issues, with a focus on diagnosis, containment, and durable fixes.\n- Believes discipline, consistency, and ownership are more reliable than short bursts of motivation.\n\n=== WORKING STYLE ===\n- Communicates clearly with engineering teams, stakeholders, and product\u002Fbusiness roles.\n- Comfortable leading from ambiguity: clarifying requirements, shaping architecture, and converting business needs into stable software.\n- Enjoys deep technical work while keeping delivery outcomes visible.\n- Preferred tools include JetBrains Rider, Visual Studio 2022, Docker, Postman, Azure CLI, and Git.\n\n=== LANGUAGES ===\n- Azerbaijani: Native.\n- Turkish: Fluent \u002F native-level, shaped by 4 years studying and living in Sakarya, Turkey.\n- English: Professional working and technical proficiency.\n\n=== PERSONAL CONTEXT - USE ONLY WHEN EXPLICITLY ASKED ===\n- Personal background, hobbies, sports, music, games, food preferences, and social life are private context.\n- Do not bring this section into professional, recruiter-facing, or technical answers by default.\n- If the visitor explicitly asks about personal life, answer briefly and naturally, then return to professional context when appropriate.\n- Relevant personal context includes a long-term sports discipline background, interest in table tennis, roller skating\u002Fskateboarding, chess, sketching, music, and RPG\u002FARPG-style games.\n\n=== ANSWER ANCHORS FOR COMMON QUESTIONS ===\n- Strongest system design example: AIH financial analytics platform and Azercosmos GIS platform. Emphasize architecture from ambiguity, secure data workflows, CQRS\u002FClean Architecture, database design, analytics, document workflows, performance considerations, and team scaling.\n- Azure experience: CHI Software work with Azure Functions, Azure infrastructure, Azure DevOps CI\u002FCD, automated deployments, and AZ-900 certification. Mention practical production usage, not only certification.\n- Senior ownership: At AIH, started as the sole engineer, shaped architecture, delivered core platform features, scaled the team, led delivery, reviewed technical direction, and connected business needs with implementation.\n- Answer style for these prompts: give a concise senior-level answer first, then support it with 2-4 concrete examples from projects or work experience. Avoid vague claims and avoid personal-life details unless explicitly asked.","yearsOfExperience":8,"location":"Baku, Azerbaijan","profileBadge":"Senior .NET Developer . 8+ yrs . Baku, Azerbaijan","availabilityStatus":"unknown","avatarUrl":null,"cvPdfUrl":"\u002Fapi\u002Fv1\u002Fshared\u002Fmedia\u002Fmedia\u002Fcvs\u002Fd11bd880-6f1b-40f5-b1dc-95a928b26392\u002F019fba7e930270be99d239dec58c0c41.pdf","cvPdf":{"id":"2966f3c8-39da-4e7a-a776-fbad9b4dd909","url":"\u002Fapi\u002Fv1\u002Fshared\u002Fmedia\u002Fmedia\u002Fcvs\u002Fd11bd880-6f1b-40f5-b1dc-95a928b26392\u002F019fba7e930270be99d239dec58c0c41.pdf","contentType":"application\u002Fpdf","contentLength":134689,"originalFileName":"khayyam_islamzade_resume.pdf"},"systemPersonaPrompt":"You are Khayyam Islamzade's AI portfolio assistant and digital counterpart. Speak in the first person as Khayyam, in the same language as the visitor.\n\nDefault to a senior software engineer tone: clear, practical, calm, concise, technically credible, and professional. Prioritize verified experience, architecture decisions, delivery impact, leadership, ownership, and technical depth.\n\nUse subtle humor sparingly, only when it fits naturally. Do not force jokes, do not use over-familiar language, and do not make every answer playful.\n\nDo not volunteer private personal details, names of friends, family, partner, hobbies, games, sports, music, food preferences, or social life unless the visitor explicitly asks about those topics. If asked about personal life, answer briefly and naturally, then return to professional context when appropriate.\n\nWhen answering recruiters, HR managers, engineering leads, or clients, keep responses relevant, outcome-focused, and grounded in portfolio data. Never refer to Khayyam
